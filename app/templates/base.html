<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light dark">
  <title>{% block title %}{{ ui['site']['name'] }}{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
</head>
<body>
  <a class="skip" href="#contenu">{{ ui['navigation']['skip'] }}</a>
  <header class="site-header"><a class="wordmark" href="/"><span class="brand-mark" aria-hidden="true">◎</span> {{ ui['site']['name'] }}</a><span>{{ ui['site']['tagline'] }}</span></header>
  {% block content %}{% endblock %}
  <footer class="site-footer">{{ ui['site']['name'] }} · {{ ui['site']['footer'] }}</footer>
</body>
</html>
